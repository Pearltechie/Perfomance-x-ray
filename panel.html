<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      background-color: #0d0e11;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
      margin: 0;
      line-height: 1.5;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    h2 { 
      color: #38bdf8; 
      margin: 0; 
      font-size: 18px; 
      font-weight: 500; 
      letter-spacing: -0.025em;
    }
    .score-badge {
      font-size: 13px;
      color: #94a3b8;
    }
    #health-score {
      color: #38bdf8;
      font-weight: 600;
      margin-left: 4px;
    }
    button {
      background: #38bdf8; 
      color: #0d0e11; 
      border: none; 
      padding: 12px 16px;
      font-weight: 500; 
      border-radius: 4px; 
      cursor: pointer; 
      width: 100%;
      font-size: 13px; 
      transition: background 0.15s ease;
    }
    button:hover { 
      background: #0ea5e9; 
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 24px 0;
    }
    .stat-card {
      background: #11141a;
      padding: 12px;
      border-radius: 4px;
      border: 1px solid #1e293b;
    }
    .stat-val { 
      font-size: 20px; 
      font-weight: 600; 
      color: #38bdf8; 
    }
    .stat-lbl { 
      font-size: 10px; 
      color: #64748b; 
      text-transform: uppercase; 
      margin-top: 4px; 
      letter-spacing: 0.05em;
    }
    .issue-row {
      background: #11141a;
      padding: 16px;
      border-radius: 4px;
      margin-bottom: 16px;
      border: 1px solid #1e293b;
    }
    .issue-meta { 
      display: flex; 
      justify-content: space-between; 
      font-size: 11px; 
      margin-bottom: 8px;
    }
    .issue-tag { 
      color: #38bdf8; 
      font-weight: 600; 
      text-transform: uppercase; 
      letter-spacing: 0.05em;
    }
    .location-tag { 
      color: #64748b; 
      font-family: monospace;
    }
    .issue-title { 
      font-weight: 500; 
      margin-bottom: 6px; 
      font-size: 13px; 
      color: #f1f5f9; 
    }
    .issue-desc { 
      font-size: 12px; 
      color: #94a3b8; 
      margin-bottom: 12px; 
    }
    pre { 
      background: #07080a; 
      padding: 12px; 
      border-radius: 4px; 
      overflow-x: auto; 
      border: 1px solid #1e293b; 
      margin: 0; 
    }
    code { 
      color: #94a3b8; 
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; 
      font-size: 12px; 
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>Performance Autopilot</h2>
    <div class="score-badge">System Health: <span id="health-score">--</span></div>
  </div>

  <button id="scan-btn">Execute Page Audit</button>

  <div class="stats-grid">
    <div class="stat-card"><div class="stat-val" id="count-thrash">0</div><div class="stat-lbl">Thrash Vector</div></div>
    <div class="stat-card"><div class="stat-val" id="total-latency">0.00ms</div><div class="stat-lbl">CPU Latency</div></div>
    <div class="stat-card"><div class="stat-val" id="count-fps">60</div><div class="stat-lbl">Target FPS</div></div>
  </div>

  <div id="results-container"></div>

  <script src="panel.js"></script>
</body>
</html>
